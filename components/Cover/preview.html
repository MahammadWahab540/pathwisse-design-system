<!-- @dsCard height=300 -->
<style>
  .cv { position: relative; width: 960px; height: 300px; background: var(--bg-canvas); overflow: hidden; font-family: var(--font-sans); }
  .cv svg { position: absolute; left: 0; top: 0; }
  .cv .learn { fill: var(--stage-learn-solid); } .cv .practice { fill: var(--stage-practice-solid); } .cv .build { fill: var(--stage-build-solid); } .cv .review { fill: var(--stage-review-solid); } .cv .prove { fill: var(--stage-prove-solid); }
  .cv .slab { rx: var(--radius-surface); }
  .cv .locked { fill: none; stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 4 4; rx: var(--radius-mark); }
  .cv .txt { position: absolute; left: 24px; bottom: 24px; width: 440px; }
  .cv h1 { margin: 0; font: 600 80px/0.95 var(--font-sans); letter-spacing: -0.035em; color: var(--text-primary); }
  .cv p { margin: 8px 0 0; font: 400 14px/20px var(--font-sans); color: var(--text-secondary); }
</style>
<div class="cv">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!-- blocks: stage-learn/practice/build/review/prove-solid, 80 wide, 72/112/152/192/232 tall (space-2 gaps), bleeding off right and bottom
         arrangement: a rising staircase of five slabs from x=528, ending in green: the Fill Ladder as a skyline
         pattern: dashed locked-cell outlines above each slab, because Pathwisse's one device is the ladder from locked to verified; empty ground above a stage is still to be earned
         steps and radii: space-2 gap, 40px cell pitch (space-10), radius-surface slabs, radius-mark cells, border-strong dashes -->
    <rect class="slab learn" x="528" y="228" width="80" height="80"/>
    <rect class="slab practice" x="616" y="188" width="80" height="120"/>
    <rect class="slab build" x="704" y="148" width="80" height="160"/>
    <rect class="slab review" x="792" y="108" width="80" height="200"/>
    <rect class="slab prove" x="880" y="68" width="80" height="240"/>
    <g class="locked-g">
      <rect class="locked" x="528" y="16" width="80" height="32"/><rect class="locked" x="528" y="56" width="80" height="32"/><rect class="locked" x="528" y="96" width="80" height="32"/><rect class="locked" x="528" y="136" width="80" height="32"/><rect class="locked" x="528" y="176" width="80" height="40"/>
      <rect class="locked" x="616" y="16" width="80" height="32"/><rect class="locked" x="616" y="56" width="80" height="32"/><rect class="locked" x="616" y="96" width="80" height="32"/><rect class="locked" x="616" y="136" width="80" height="40"/>
      <rect class="locked" x="704" y="16" width="80" height="32"/><rect class="locked" x="704" y="56" width="80" height="32"/><rect class="locked" x="704" y="96" width="80" height="40"/>
      <rect class="locked" x="792" y="16" width="80" height="32"/><rect class="locked" x="792" y="56" width="80" height="40"/>
      <rect class="locked" x="880" y="16" width="80" height="40"/>
    </g>
  </svg>
  <div class="txt"><h1>Pathwisse<br>ProofOS</h1><p>Capability, made visible.</p></div>
</div>
