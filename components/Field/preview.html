<div id="root" style="padding:16px;background:var(--bg-canvas)"></div>
<script>
const P = window.Pathwisse, h = React.createElement;
const Stack = (p) => h("div", {style: Object.assign({display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}, p.style)}, p.children);
function App(){return h("div",{style:{display:"grid",gap:16,maxWidth:360}},
 h(P.Field,{label:"Project title",hint:"Shown on your evidence card.",defaultValue:"Orders dashboard"}),
 h(P.Field,{label:"Reviewer email",error:"Enter a valid email address.",defaultValue:"priya@"}),
 h(P.Field,{label:"Notes",multiline:true,placeholder:"What should the reviewer look at?"}),
 h(P.Field,{label:"Credential ID",disabled:true,defaultValue:"PW-0001"}));}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
